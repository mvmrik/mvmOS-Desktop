<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mvmOS Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="onboarding" class="onboarding hidden">
      <div class="onboarding-card">
        <h1>mvmOS Desktop</h1>
        <p class="subtitle">Add your first mvmOS installation to get started.</p>
        <form id="onboarding-form" class="installation-form">
          <label>
            Display name
            <input id="onboarding-name" type="text" placeholder="e.g. Home server" autocomplete="off" />
          </label>
          <label>
            Address
            <input id="onboarding-address" type="text" placeholder="e.g. mvmos.example.com or 192.168.1.10:2026" autocomplete="off" required />
          </label>
          <button type="submit">Add installation</button>
          <p class="form-error hidden" id="onboarding-error"></p>
        </form>
      </div>
    </div>

    <!--
      The chrome webview is only ever the sidebar strip (or the whole window
      while onboarding is up), never the tab area, so status messages live in
      the sidebar itself - there is no surface of our own next to the tabs.
    -->
    <div id="shell" class="shell hidden">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="brand">mvmOS Desktop</span>
          <button id="add-installation-btn" class="icon-btn" title="Add installation">+</button>
        </div>
        <div id="installation-list" class="installation-list"></div>
        <div id="empty-state" class="status-panel">
          <p id="empty-state-text">Select or open an installation from the sidebar.</p>
        </div>
        <div id="offline-panel" class="status-panel hidden">
          <p id="offline-message">This installation could not be reached.</p>
          <button id="offline-retry-btn">Retry</button>
        </div>
      </aside>
    </div>

    <div id="add-installation-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Add installation</h2>
        <form id="add-installation-form" class="installation-form">
          <label>
            Display name
            <input id="modal-name" type="text" placeholder="e.g. Work server" autocomplete="off" />
          </label>
          <label>
            Address
            <input id="modal-address" type="text" placeholder="e.g. mvmos.example.com or 192.168.1.10:2026" autocomplete="off" required />
          </label>
          <p class="form-error hidden" id="modal-error"></p>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="secondary">Cancel</button>
            <button type="submit">Add</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
