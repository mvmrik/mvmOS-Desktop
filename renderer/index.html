<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="styles.css" />
    <title>mvmOS Desktop</title>
    <script src="renderer.js" defer></script>
  </head>

  <body>
    <!-- Shown until there is at least one installation to put in the sidebar. -->
    <div id="onboarding" class="onboarding hidden">
      <div class="onboarding-card">
        <h1>mvmOS Desktop</h1>
        <p class="subtitle">Add your first mvmOS installation to get started.</p>
        <form id="onboarding-form" class="installation-form">
          <label>
            Display name
            <input id="onboarding-name" type="text" placeholder="e.g. Home server" autocomplete="off" />
          </label>
          <label>
            Address
            <input id="onboarding-address" type="text" placeholder="e.g. mvmos.example.com or 192.168.1.10:2026" autocomplete="off" required />
          </label>
          <button type="submit">Add installation</button>
          <p class="form-error hidden" id="onboarding-error"></p>
        </form>
      </div>
    </div>

    <!--
      The right-hand pane is covered by the active tab's own view whenever one
      is open, so it only ever shows the states that exist between tabs.
    -->
    <div id="shell" class="shell hidden">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="brand">mvmOS Desktop</span>
          <div class="sidebar-header-actions">
            <button id="add-installation-btn" class="icon-btn" title="Add installation">+</button>
            <button id="hide-sidebar-btn" class="icon-btn" title="Hide sidebar (Ctrl/Cmd+B)">‹</button>
          </div>
        </div>
        <div id="installation-list" class="installation-list"></div>
      </aside>

      <main id="content-area" class="content-area">
        <div id="status-panel" class="status-card">
          <p id="status-text">Select or open an installation from the sidebar.</p>
          <button id="status-retry-btn" class="hidden">Retry</button>
        </div>
      </main>
    </div>

    <!-- Add / edit share one dialog; the title and submit label switch. -->
    <div id="installation-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="installation-modal-title">Add installation</h2>
        <form id="installation-form" class="installation-form">
          <label>
            Display name
            <input id="modal-name" type="text" placeholder="e.g. Work server" autocomplete="off" />
          </label>
          <label>
            Address
            <input id="modal-address" type="text" placeholder="e.g. mvmos.example.com or 192.168.1.10:2026" autocomplete="off" required />
          </label>
          <p class="form-error hidden" id="modal-error"></p>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="secondary">Cancel</button>
            <button type="submit" id="modal-submit-btn">Add</button>
          </div>
        </form>
      </div>
    </div>

    <!--
      A dialog of our own rather than window.confirm(): the native one is
      suppressed in some webview hosts, which is why removing an installation
      silently did nothing before.
    -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="modal-actions">
          <button type="button" id="confirm-cancel-btn" class="secondary">Cancel</button>
          <button type="button" id="confirm-ok-btn" class="danger">Remove</button>
        </div>
      </div>
    </div>
  </body>
</html>
