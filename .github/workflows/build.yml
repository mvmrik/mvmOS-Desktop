name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            name: linux
            args: --linux
          - platform: windows-latest
            name: windows
            args: --win
          - platform: macos-latest
            name: macos
            args: --mac

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The macOS build is intentionally unsigned: this repository holds no Apple
      # Developer identity, so electron-builder must not look for one.
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mvmos-desktop-${{ matrix.name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: mvmOS Desktop v${{ steps.version.outputs.value }}
          body: See the assets below to download for your platform.
          files: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
